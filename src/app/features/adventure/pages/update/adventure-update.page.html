<app-section-wrapper [title]="'Editar aventura'">
  <form [formGroup]="form" *ngIf="form">
    <div class="row row-gap-3">
      <app-form-input
        [label]="'Título'"
        [placeholder]="'Digite o título da aventura'"
        [control]="$any(form.get('title'))"
        fieldName="title"
        col="12"
        colMd="6"
      />

      <app-form-textarea
        [label]="'Descrição'"
        [placeholder]="'Descreva a aventura'"
        [control]="$any(form.get('description'))"
        fieldName="description"
        col="12"
        [rows]="6"
      />

      <div class="col-12 mt-3">
        <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="form.invalid">
          Salvar alterações
        </button>
        <button type="button" class="btn btn-secondary ms-2" (click)="onCancel()">
          Cancelar
        </button>
      </div>
    </div>
  </form>
</app-section-wrapper>
