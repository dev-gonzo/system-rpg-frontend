@if (confirmationModalService.getModal(); as modal) {
  <div 
    class="modal-backdrop"
    (click)="onBackdropClick($event)"
    (keydown)="onKeyDown($event)"
  >
    <dialog class="modal-dialog" open >
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            {{ modal.title }}
          </h5>
          <button 
            type="button" 
            class="btn-close" 
            aria-label="Fechar modal"
            (click)="cancel()"
          ></button>
        </div>

        <div class="modal-body">
          @if (modal.inputLabel && (modal.inputMode ?? 'text') === 'text') {
            <app-form-input
              [label]="modal.inputLabel"
              [placeholder]="modal.inputPlaceholder ?? ''"
              [control]="$any(inputControl)"
              [type]="modal.inputType ?? 'text'"
              fieldName="modal-input"
              col="12"
            ></app-form-input>
          } @else if (modal.inputLabel && (modal.inputMode ?? 'text') === 'autocomplete') {
            <app-form-autocomplete
              [label]="modal.inputLabel"
              [placeholder]="modal.inputPlaceholder ?? ''"
              [control]="$any(autocompleteControl)"
              [options]="autocompleteOptions"
              (searchTextChange)="handleSearch($event)"
            ></app-form-autocomplete>
          } @else {
            <p>
              {{ modal.message }}
            </p>
          }
        </div>

        <div class="modal-footer">
          <button 
            type="button" 
            [class]="getCancelButtonClasses(modal.cancelButtonClass)"
            (click)="cancel()"
          >
            {{ modal.cancelText }}
          </button>
          <button 
            type="button" 
            [class]="getConfirmButtonClasses(modal.confirmButtonClass)"
            (click)="confirm()"
          >
            {{ modal.confirmText }}
          </button>
        </div>
      </div>
    </dialog>
  </div>
}
